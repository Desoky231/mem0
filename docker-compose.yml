version: '3.8'
services:
  neo4j:
    image: neo4j:latest
    container_name: mem0_neo4j
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt connection
    environment:
      - NEO4J_AUTH=neo4j/mem0password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
